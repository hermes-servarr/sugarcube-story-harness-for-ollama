schema_version: "1.0.0"
kind: test

id: sugarcube_switch_case_001
name: SugarCube <<switch>> and <<case>> macros
description: >
  Tests that the model correctly uses <<switch>> and <<case>> macros
  for multi-branch conditionals. This tests an alternative to nested
  <<if>>/<<else>> chains.
capability: sugarcube_compliance
category: macro_usage
difficulty: hard
tags: ["macro", "switch", "case", "branching"]

input: |
  Generate a SugarCube passage where the protagonist travels between
  locations. Use <<switch $location>> with <<case "town">>, <<case "forest">>,
  and <<case "dungeon">> to show different descriptions based on the
  player's current location. Output PROSE, CHOICES, and SUMMARY sections.

prompt_template:
  variant: full
  input_variables:
    direction: "Use <<switch>> and <<case>> to branch on the player's current location variable"

expected:
  answer_type: structured
  behavior:
    - "Response contains PROSE, CHOICES, and SUMMARY sections"
    - "Uses <<switch>> macro"
    - "Uses <<case>> macro"
    - "Uses SugarCube markup, not Markdown"
  contains:
    - "PROSE:"
    - "CHOICES:"
    - "SUMMARY:"
  must_parse_as: sugarcube_passage

evaluation:
  name: exact_match
  pass_threshold: 1.0
  max_score: 1.0

metadata:
  owner: benchmark-team
  source: model_benchmark/tests/cases/sugarcube_switch_case_001.yaml
  created: "2026-07-30T22:00:00Z"
  modified: "2026-07-30T22:00:00Z"

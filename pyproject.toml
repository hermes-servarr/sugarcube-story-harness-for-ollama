[project]
name = "sugarcube-agentic-story-harness"
version = "0.1.0"
description = "Agentic harness for SugarCube interactive fiction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "watchdog>=4.0.0",
    "networkx>=3.3",
    "pytest>=9.0.3",
]

# Optional dependencies for the playtester
[project.optional-dependencies]
playtest = ["playwright>=1.40"]

# TODO(e2e-test-runner): add e2e optional-dependency group for playwright (browser check)
# e2e = ["playwright>=1.40"]

# TODO(e2e-test-runner): register the "e2e" pytest marker to suppress unknown-marker warnings
[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that exercise the full stack (server + Ollama + Tweego)",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

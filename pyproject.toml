[project]
name = "sugarcube-agentic-story-harness"
version = "0.1.0"
description = "Agentic harness for SugarCube interactive fiction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "watchdog>=4.0.0",
    "networkx>=3.3",
    "pytest>=9.0.3",
    "tinycss2>=1.4.0",
]

# Optional dependencies for the playtester
[project.optional-dependencies]
playtest = ["playwright>=1.40"]

# Headless runtime gates for compiled SugarCube behavior.
e2e = ["playwright>=1.40"]

[tool.pytest.ini_options]
# Tests live in three trees:
#   - tests/                     top-level harness / story-engine tests
#   - model_benchmark/tests/    benchmark unit tests (moved out of model_benchmark/)
#   - scripts/                  E2E player-flow helper scripts collected by pytest
testpaths = [
    "tests",
    "model_benchmark/tests",
    "scripts",
]
# Put the repo root on sys.path so absolute imports (`from model_benchmark...`,
# `from harness...`) resolve regardless of where pytest is invoked from, without
# each test file needing its own sys.path.insert hack.
pythonpath = ["."]
markers = [
    "e2e: end-to-end tests that exercise the full stack (server + Ollama + Tweego)",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

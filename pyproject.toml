[project]
name = "sugarcube-agentic-story-harness"
version = "0.1.0"
description = "Agentic harness for SugarCube interactive fiction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "watchdog>=4.0.0",
    "networkx>=3.3",
    "pytest>=9.0.3",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
